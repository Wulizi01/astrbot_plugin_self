name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 开发与部署都在 Windows 上，所以两边都跑一遍：
    # verify_live 的找库逻辑、临时目录、路径分隔符都值得在 windows 上被真跑一次。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: core tests
        run: python tests/test_core.py
      - name: panel api tests
        run: python tests/test_page_api.py
      - name: tools tests
        run: python tests/test_tools.py
      - name: form tests
        run: node tests/test_form.js
      - name: compile check
        run: python -m compileall -q main.py page_api.py core tools
